name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: emberr
                    POSTGRES_PASSWORD: ci-test-password
                    POSTGRES_DB: emberr_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U emberr -d emberr_test"
                    --health-interval 2s
                    --health-timeout 5s
                    --health-retries 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache-dependency-path: go.sum
                  cache: true

            - name: Check formatting
              run: |
                  unformatted="$(gofmt -l .)"
                  test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }

            - name: Vet
              run: go vet ./...

            - name: Test
              env:
                  PGHOST: localhost
                  PGPORT: 5432
                  PGDATABASE: emberr_test
                  PGUSER: emberr
                  PGPASSWORD: ci-test-password
                  PGSSLMODE: disable
              run: go test ./...
