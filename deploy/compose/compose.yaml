services:
  server:
    build:
      context: ../..
    ports:
      - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      garage:
        condition: service_started
    env_file: .env

  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: ${EMBERR_DB_USER}
      POSTGRES_PASSWORD: ${EMBERR_DB_PASSWORD}
      POSTGRES_DB: ${EMBERR_DB_NAME}
    healthcheck:
      test: pg_isready -q -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"
      interval: 2s
      start_period: 40s
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro,z

  mailpit:
    image: docker.io/axllent/mailpit:v1
    ports:
      - 8025:8025

  garage:
    image: docker.io/dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${EMBERR_S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${EMBERR_S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${EMBERR_S3_BUCKET}
    ports:
      - 3900:3900
    volumes:
      - ./garage.toml:/etc/garage.toml:ro,z
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

volumes:
  postgres-data:
  garage-meta:
  garage-data:
